# Identity the handler runs as.
#
# Its Kubernetes permissions come from rbac.yaml. If the handler also needs
# Google Cloud APIs, bind a GCP service account here with Workload Identity:
#
#   annotations:
#     iam.gke.io/gcp-service-account: meeting-bot-handler@PROJECT.iam.gserviceaccount.com

apiVersion: v1
kind: ServiceAccount
metadata:
  name: meeting-bot-handler
  labels:
    app.kubernetes.io/name: meeting-bot-handler
