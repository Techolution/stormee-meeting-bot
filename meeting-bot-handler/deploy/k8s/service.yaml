# Entry point for callers of the control plane — schedulers, Cloud Tasks, the
# meeting API. Load balancing across handler replicas is fine: unlike a bot
# pod, any handler can serve any session.

apiVersion: v1
kind: Service
metadata:
  name: meeting-bot-handler
  labels:
    app.kubernetes.io/name: meeting-bot-handler
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meeting-bot-handler
  ports:
    - name: http
      port: 80
      targetPort: http
