# Local development stack.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# Redis is included because it is the one optional dependency worth exercising
# locally — the in-memory fallback hides state-persistence problems until
# production.

services:
  meeting-bot:
    build:
      context: ..
      dockerfile: Dockerfile
    image: meeting-bot:local
    ports:
      - "${APP_PORT:-5000}:5000"

    # Chromium's shared-memory needs exceed Docker's 64MB default; without this
    # the browser crashes partway through a meeting.
    ipc: host

    env_file:
      - ../.env
    environment:
      ENVIRONMENT: local
      LOG_FORMAT: text
      BROWSER_PROFILE_DIR: /data/chrome_profile
      REDIS_ENABLED: "true"
      REDIS_HOST: redis

    volumes:
      # Live Google session cookies — mounted, never built into the image.
      - ../chrome_profile:/data/chrome_profile

    depends_on:
      redis:
        condition: service_healthy

    # Matches the container's own bounded shutdown, so a recording is finalized
    # rather than truncated on `docker compose down`.
    stop_grace_period: 180s

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/meet/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
