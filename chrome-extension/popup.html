<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>GMeet Bot Control</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        width: 320px;
        padding: 12px;
        box-sizing: border-box;
      }
      h3 {
        margin: 0 0 10px 0;
        text-align: center;
      }
      .status-wrapper {
        display: none;
        position: sticky;
        top: 0;
        z-index: 2;
        background: #fff;
        padding: 4px 0 0;
        margin: 0 0 6px 0;
        border-top: 1px solid #eee;
      }
      .status-wrapper.visible {
        display: block;
      }
      label {
        display: block;
        margin-top: 8px;
        font-size: 0.85em;
        font-weight: bold;
        color: #333;
      }
      input {
        width: 100%;
        padding: 6px 8px;
        margin-top: 2px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      .btn-group {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      button {
        flex: 1;
        padding: 8px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
      }
      #start-btn, #start-rec-btn, #play-audio-btn {
        background-color: #28a745;
        color: white;
      }
      #stop-btn, #stop-rec-btn {
        background-color: #dc3545;
        color: white;
      }
      #add-recipient-btn {
        background-color: #007bff;
        color: white;
        width: 100%;
        margin-top: 6px;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status {
        margin: 0;
        font-size: 0.85em;
        text-align: center;
        word-break: break-all;
        min-height: 16px;
      }
      .status-success { color: green; }
      .status-error { color: red; }
      
      .divider {
        border-top: 1px solid #eee;
        margin: 12px 0;
      }

      /* Modal Styling */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.5);
      }
      .modal-content {
        background-color: white;
        margin: 25% auto;
        padding: 15px;
        width: 80%;
        border-radius: 6px;
        text-align: center;
      }
      .modal-buttons {
        margin-top: 12px;
        display: flex;
        gap: 10px;
      }
      select {
        width: 100%;
        padding: 6px 8px;
        margin-top: 2px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: white;
      }
      .api-url {
      font-size: 11px;
      color: #777;
      text-align: center;
      word-break: break-all;
    }
    </style>
  </head>
  <body>
    <div id="status-wrapper" class="status-wrapper">
      <p id="status"></p>
    </div>

    <h3>GMeet Bot Control</h3>

    <label for="environment">Environment</label>
    <select id="environment">
      <option value="local">Local</option>
      <option value="development">Development</option>
      <option value="qa">Qa</option>
      <option value="production">Production</option>
    </select>
    <label for="meetingUrl">Meeting URL</label>
    <input id="meetingUrl" type="text" placeholder="https://meet.google.com/abc-defg-hij" />

    <label for="meetingId">Meeting ID</label>
    <input id="meetingId" type="text" placeholder="xcv-qzmt-nhr" />

    <label for="maxDurationSeconds">Max Duration (seconds)</label>
    <input id="maxDurationSeconds" type="number" min="1" step="1" placeholder="10" />

    <label for="generateIncrementalHighlights" style="display:flex; align-items:center; gap:8px; margin-top:10px; font-weight:normal;">
      <input id="generateIncrementalHighlights" type="checkbox" style="width:auto; margin:0;" checked />
      Generate Incremental Highlights
    </label>

    <label for="meetingTitle">Meeting Title</label>
    <input id="meetingTitle" type="text" placeholder="Test Meet" />

    <label for="userName">User Name</label>
    <input id="userName" type="text" placeholder="Swikrit Shukla" />

    <label for="userEmail">User Email</label>
    <input id="userEmail" type="email" placeholder="swikrit.shukla@techolution.com" />

    <label for="projectId">Project ID</label>
    <input id="projectId" type="text" placeholder="6a78bbb3dfeb370713b22c8d" />

    <label for="projectName">Project Name</label>
    <input id="projectName" type="text" placeholder="MeetBot Test" />

    <div class="btn-group">
      <button id="start-btn">Start Bot</button>
      <button id="stop-btn">Stop Bot</button>
    </div>

    <div class="btn-group">
      <button id="start-rec-btn">Start Recording</button>
      <button id="stop-rec-btn">Stop Recording</button>
    </div>

    <div class="btn-group">
      <button id="play-audio-btn">Play Audio</button>
    </div>

    <label for="audioUrl">Audio URL</label>
    <input id="audioUrl" type="text" placeholder="https://storage.googleapis.com/..." />

    <label for="volume">Volume (0.0 - 1.0)</label>
    <input id="volume" type="number" min="0" max="1" step="0.1" value="0.7" />

    <p id="api-url" class="api-url"></p>
    <div class="divider"></div>


    <script src="popup.js"></script>
  </body>
</html>
