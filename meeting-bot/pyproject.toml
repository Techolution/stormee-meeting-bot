[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-bot"
version = "1.0.0"
description = "Joins video meetings, records their audio, and produces transcripts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Techolution" }]
keywords = ["meeting", "bot", "transcription", "google-meet", "playwright"]

classifiers = [
  "Private :: Do Not Upload",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# Pinned to compatible ranges rather than exact versions: exact pins in an
# application make security patching a manual chore, and the lock file
# (requirements.txt) is what makes a build reproducible.
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "playwright>=1.55,<2.0",
  "python-socketio[asyncio_client]>=5.13,<6.0",
  "redis>=5.0,<7.0",
  "python-dotenv>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-redis>=4.6",
]

[project.scripts]
meeting-bot = "app.main:main"

[project.urls]
Documentation = "./docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# The browser-side JavaScript is loaded from disk at runtime; without this it is
# absent from an installed wheel and every join fails.
"app.meeting_platform.google_meet.scripts" = ["*.js"]

# --------------------------------------------------------------------------
# Tests
# --------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "slow: takes more than a second",
  "browser: needs a real Chromium install",
]
filterwarnings = [
  "error",
  # Starlette renamed its 422 constant; FastAPI still uses the old name internally.
  "ignore:'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated:DeprecationWarning",
  "default::UserWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/main.py"]

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@abstractmethod",
]

# --------------------------------------------------------------------------
# Linting
# --------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "F",    # pyflakes
  "W",    # warnings
  "I",    # import order
  "N",    # naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "C4",   # comprehensions
  "SIM",  # simplify
  "RUF",  # ruff-specific
  "ASYNC",# async correctness
  "T20",  # no print()
  "TID",  # tidy imports
  "BLE",  # blind except — every one in this codebase carries a reason
  "SLF",  # private member access across boundaries
]
ignore = [
  "E501",    # line length is handled by the formatter
  "B008",    # FastAPI's Depends() in defaults is idiomatic
  "SIM108",  # a ternary is not always clearer than an if
  # A `timeout` argument is part of several deliberate public APIs here; the
  # rule wants `asyncio.timeout` at the call site instead, which would push the
  # decision onto every caller.
  "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private state deliberately, to assert internal guarantees.
"tests/*" = ["SLF001", "S101", "PLR2004"]
# Operator CLIs: printing to a terminal is the whole point, and a one-shot
# script has no event loop to keep responsive.
"scripts/*" = ["T20", "ASYNC230", "ASYNC240"]
# The entry point puts the project root on sys.path before importing `app`, so
# that `python app/main.py` works without the package being installed. That
# bootstrap has to run before those imports.
"app/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports obscure which layer a module belongs to.
ban-relative-imports = "all"

# --------------------------------------------------------------------------
# Type checking
# --------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
files = ["app"]
# Without this, mypy reads only a field's alias and rejects every construction
# by field name, which `populate_by_name` explicitly permits.
plugins = ["pydantic.mypy"]
strict = false
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["socketio.*"]
ignore_missing_imports = true
