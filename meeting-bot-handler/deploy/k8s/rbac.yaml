# Permission to discover bot pods.
#
# This is what makes dispatch work: the handler lists the pods behind the bot
# Deployment, probes each one, and addresses the free one directly. Without
# this Role every join fails with no_bot_pod_available, and GET /bot-pods
# reports discovery as unavailable — the first thing to check when it does.
#
# Scope is deliberately minimal: read-only, on pods, in one namespace. The
# handler never creates, patches or deletes anything.
#
# The Role must live in the namespace the BOT PODS run in. When the handler
# runs elsewhere, apply this file to the bot namespace and leave the
# subject's namespace below pointing at the handler's.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meeting-bot-pod-reader
  labels:
    app.kubernetes.io/name: meeting-bot-handler
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meeting-bot-handler-pod-reader
  labels:
    app.kubernetes.io/name: meeting-bot-handler
subjects:
  - kind: ServiceAccount
    name: meeting-bot-handler
    # Set this to the handler's namespace if it differs from the bots'.
    namespace: default
roleRef:
  kind: Role
  name: meeting-bot-pod-reader
  apiGroup: rbac.authorization.k8s.io
